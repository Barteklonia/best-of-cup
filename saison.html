<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Saison & Spielplan | Best of Cup (Deutschlandweit & Weltweit)</title>
    <meta name="description"
        content="Aktuelle Tabellen, Ergebnisse, Termine und Spielpläne der Best of Cup Jugendliga. Verfolge alle Begegnungen und Leistungsvergleiche unserer Nachwuchsteams in ganz Deutschland und weltweit im Überblick.">
    <meta name="keywords"
        content="Jugendliga, Teams auf Augenhöhe, Nachwuchsfußball, Fairplay Liga, Jugend Spielbetrieb, ausgeglichene Spielstärke, Best of Cup, Jugendfußball Leistungsvergleich, twin games, Tabelle, Ergebnisse, deutschlandweit, weltweit, internationale Jugendfußball Liga">
    <meta name="google-site-verification" content="Y6n2BrMJvXwZVzJqDXgkn7EaSfxmCRAG">

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Saison & Spielplan | Best of Cup (Deutschlandweit & Weltweit)">
    <meta property="og:description"
        content="Aktuelle Tabellen, Ergebnisse und Spielpläne der Best of Cup Jugendliga – spannende Spiele auf Augenhöhe in ganz Deutschland und weltweit.">
    <meta property="og:image" content="https://bestofcup.de/assets/logo.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bestofcup.de/saison.html">

    <link rel="icon" type="image/jpeg" href="assets/logo.jpg">
    <link rel="stylesheet" href="css/style.css?v=1.1">

    <script src="js/config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>

<body>

    <header>
        <a href="index.html"><img src="assets/logo.jpg" alt="Logo" class="nav-logo"></a>
        <nav>
            <ul>
                <li><a href="index.html">Startseite</a></li>
                <li><a href="saison.html" class="active">Saison</a></li>
                <li><a href="regeln.html">Regeln</a></li>
                <li><a href="sponsoring.html">Sponsoring</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="page-header">
            <h1 id="page-title">Best of Cup</h1>
        </div>

        <div class="filter-container card"
            style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; justify-content: center;">
            <div style="display: flex; flex-direction: column; flex: 1; min-width: 150px;">
                <label for="season-select"
                    style="font-weight: bold; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; color: #666;">Saison</label>
                <select id="season-select" style="width: 100%; font-weight: bold; background-color: white;"
                    onchange="onSeasonChange()"></select>
            </div>
            <div style="display: flex; flex-direction: column; flex: 1; min-width: 150px;">
                <label for="age-select"
                    style="font-weight: bold; font-size: 0.8rem; text-transform: uppercase; margin-bottom: 5px; color: #666;">Jahrgang</label>
                <select id="age-select" style="width: 100%; font-weight: bold; background-color: white;"
                    onchange="onAgeGroupChange()"></select>
            </div>
        </div>

        <div class="filter-tabs variant-tabs"
            style="margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
            <button class="filter-btn active" onclick="updateVariant('gesamt', this)">Gesamtwertung</button>
            <button class="filter-btn" id="btn-variant-81" onclick="updateVariant('81', this)">Feld (8+1)</button>
            <button class="filter-btn" onclick="updateVariant('41', this)">Twin Games</button>
        </div>

        <div class="filter-tabs">
            <button class="filter-btn active" onclick="updateTable('gesamt', this)">Tabelle</button>
            <button class="filter-btn" onclick="updateTable('heim', this)">Heim</button>
            <button class="filter-btn" onclick="updateTable('auswaerts', this)">Auswärts</button>
            <button class="filter-btn" onclick="updateTable('hinrunde', this)">Hinrunde</button>
            <button class="filter-btn" onclick="updateTable('rueckrunde', this)">Rückrunde</button>
        </div>

        <div class="table-container">
            <table class="bundesliga-table">
                <thead>
                    <tr>
                        <th class="th-rank">Pl.</th>
                        <th class="th-team">Team</th>
                        <th>Sp.</th>
                        <th class="hide-mobile">S</th>
                        <th class="hide-mobile">U</th>
                        <th class="hide-mobile">N</th>
                        <th>Tore</th>
                        <th>Diff.</th>
                        <th class="th-points">Pkte.</th>
                        <th class="hide-mobile">Form</th>
                    </tr>
                </thead>
                <tbody id="tabelle-body"></tbody>
            </table>
        </div>

        <div class="matchday-selector-bar">
            <button class="matchday-nav-btn" id="btn-prev" onclick="changeMatchday(-1)">&#10094;</button>
            <select id="matchday-select" class="matchday-select" onchange="renderSchedule()"></select>
            <button class="matchday-nav-btn" id="btn-next" onclick="changeMatchday(1)">&#10095;</button>
        </div>

        <div id="schedule-list" class="match-list"></div>

    </main>

    <footer>
        <p>&copy; 2025 Best of Cup</p>
        <p style="margin-top: 10px;">
            <a href="impressum.html" style="color: inherit; text-decoration: none; margin: 0 10px;">Impressum</a> |
            <a href="datenschutz.html" style="color: inherit; text-decoration: none; margin: 0 10px;">Datenschutz</a> |
            <a href="logbuch.html" style="color: inherit; text-decoration: none; margin: 0 10px;">Logbuch</a>
        </p>
    </footer>

    <!-- Match Details Modal removed as it is now a separate page -->

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAW55bZ_AbRRja3na--YmYP4MBCQQVCtBg",
            authDomain: "best-of-cup.firebaseapp.com",
            projectId: "best-of-cup",
            storageBucket: "best-of-cup.firebasestorage.app",
            messagingSenderId: "188725945748",
            appId: "1:188725945748:web:3a5fe06b1548bfc40c9b81",
            measurementId: "G-HGCM4M029D"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let selectedSeason = "";
        let selectedAgeGroup = "";
        let activeConfig = null;
        let schedule = [];
        let teamLogos = {};
    let allMatchDates = {};

        let allResults = {};
        let currentFilter = 'gesamt';
        let currentVariant = 'gesamt';

        window.onload = function () {
            initSelectors();
        };

        function initSelectors() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlSeason = urlParams.get('saison');
            const urlAgeGroup = urlParams.get('jahrgang');

            const seasonSelect = document.getElementById('season-select');
            seasonSelect.innerHTML = "";

            const seasons = Object.keys(CUP_DATA.seasons);
            seasons.forEach(key => {
                let opt = document.createElement('option');
                opt.value = key;
                opt.innerHTML = CUP_DATA.seasons[key].displayName;
                seasonSelect.appendChild(opt);
            });

            if (seasons.length <= 1) {
                seasonSelect.classList.add('no-arrow');
            } else {
                seasonSelect.classList.remove('no-arrow');
            }

            // Default to Saison 26/27 if available, otherwise fall back to the first season
            if (urlSeason && seasons.includes(urlSeason)) {
                selectedSeason = urlSeason;
            } else {
                selectedSeason = seasons.includes("2026_2027") ? "2026_2027" : seasons[0];
            }
            seasonSelect.value = selectedSeason;

            updateAgeGroupSelector(urlAgeGroup);
        }

        function updateAgeGroupSelector(urlAgeGroup) {
            const ageSelect = document.getElementById('age-select');
            ageSelect.innerHTML = "";

            const ageGroups = Object.keys(CUP_DATA.seasons[selectedSeason].ageGroups);
            ageGroups.forEach(key => {
                let opt = document.createElement('option');
                opt.value = key;
                opt.innerHTML = CUP_DATA.seasons[selectedSeason].ageGroups[key].displayName;
                ageSelect.appendChild(opt);
            });

            if (ageGroups.length <= 1) {
                ageSelect.classList.add('no-arrow');
            } else {
                ageSelect.classList.remove('no-arrow');
            }

            if (urlAgeGroup && typeof urlAgeGroup === 'string' && ageGroups.includes(urlAgeGroup)) {
                selectedAgeGroup = urlAgeGroup;
            } else {
                selectedAgeGroup = ageGroups[0];
            }
            ageSelect.value = selectedAgeGroup;

            updateActiveConfig();
        }

        function updateActiveConfig() {
            activeConfig = CUP_DATA.seasons[selectedSeason].ageGroups[selectedAgeGroup];
            schedule = activeConfig.schedule;

            // Build teamLogos mapping
            teamLogos = {};
            for (let t in activeConfig.teams) {
                teamLogos[t] = activeConfig.teams[t].logo;
            }

            // Update 81 button text based on age group
            const btn81 = document.getElementById('btn-variant-81');
            if (btn81) {
                btn81.innerText = selectedAgeGroup === "2016" ? "Feld (6+1)" : "Feld (8+1)";
            }

            // Update header title dynamically
            document.getElementById('page-title').innerHTML = `Best of Cup - ${CUP_DATA.seasons[selectedSeason].displayName}`;

            // Rebuild matchday selector
            const select = document.getElementById('matchday-select');
            select.innerHTML = "";
            schedule.forEach((day, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.innerHTML = day.name;
                select.appendChild(opt);
            });
            select.value = 0; // Reset to first matchday

            loadData();
        }

        function onSeasonChange() {
            selectedSeason = document.getElementById('season-select').value;
            updateAgeGroupSelector();
        }

        function onAgeGroupChange() {
            selectedAgeGroup = document.getElementById('age-select').value;
            updateActiveConfig();
        }

        function loadData() {
            Promise.all([
                db.collection("spiele").get(),
                db.collection("match_dates").get()
            ]).then(([spieleSnapshot, datesSnapshot]) => {
                allResults = {};
                spieleSnapshot.forEach((doc) => {
                    const game = doc.data();

                    // Filter by selected season and age group (defaulting to 25/26 and 2014 for legacy games)
                    const s = game.saison || "2025_2026";
                    const j = game.jahrgang || "2014";

                    if (s === selectedSeason && j === selectedAgeGroup) {
                        const h = game.heim;
                        const a = game.gast;
                        allResults[`${h}_${a}`] = {
                            gH_81: parseInt(game.ergebnis81[0]),
                            gA_81: parseInt(game.ergebnis81[1]),
                            gH_41: parseInt(game.ergebnis41[0]),
                            gA_41: parseInt(game.ergebnis41[1]),
                            datum: game.datum ? (game.datum.toDate ? game.datum.toDate() : new Date(game.datum)) : new Date(0)
                        };
                    }
                });

                allMatchDates = {};
                datesSnapshot.forEach((doc) => {
                    const dateData = doc.data();
                    if (dateData.ageGroup && dateData.ageGroup.toString() === selectedAgeGroup) {
                        allMatchDates[doc.id] = dateData;
                    }
                });

                calculateTable(currentFilter);
                renderSchedule();
            }).catch(error => {
                console.error("Error loading data: ", error);
            });
        }

        function updateVariant(variant, btn) {
            currentVariant = variant;
            document.querySelectorAll('.variant-tabs .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            calculateTable(currentFilter);
        }

        function updateTable(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tabs:not(.variant-tabs) .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            calculateTable(filter);
        }

        function calculateTable(filter) {
            let stats = {};
            for (let t in teamLogos) {
                stats[t] = {
                    name: t,
                    logo: teamLogos[t],
                    m: 0,
                    w: 0,
                    d: 0,
                    l: 0,
                    g: 0,
                    a: 0,
                    p: 0,
                    formGames: []
                };
            }

            schedule.forEach((day, dayIndex) => {
                const halfLength = Math.ceil(schedule.length / 2);
                const isHinrunde = dayIndex < halfLength;
                const isRueckrunde = dayIndex >= halfLength;
                if (filter === 'hinrunde' && !isHinrunde) return;
                if (filter === 'rueckrunde' && !isRueckrunde) return;

                day.matches.forEach(match => {
                    const h = match[0];
                    const a = match[1];
                    if (!a) return;

                    const res = allResults[`${h}_${a}`];
                    if (res) {
                        const isHomeEligible = (filter !== 'auswaerts');
                        const isAwayEligible = (filter !== 'heim');

                        // 8+1 Results
                        const goalsH_81 = res.gH_81;
                        const goalsA_81 = res.gA_81;
                        let pointsH_81 = 0, pointsA_81 = 0;
                        let outcomeH_81 = 'U', outcomeA_81 = 'U';
                        if (goalsH_81 > goalsA_81) {
                            pointsH_81 = 3; outcomeH_81 = 'S'; outcomeA_81 = 'N';
                        } else if (goalsA_81 > goalsH_81) {
                            pointsA_81 = 3; outcomeH_81 = 'N'; outcomeA_81 = 'S';
                        } else {
                            pointsH_81 = 1; pointsA_81 = 1; outcomeH_81 = 'U'; outcomeA_81 = 'U';
                        }

                        // 4+1 Results
                        const goalsH_41 = res.gH_41;
                        const goalsA_41 = res.gA_41;
                        let pointsH_41 = 0, pointsA_41 = 0;
                        let outcomeH_41 = 'U', outcomeA_41 = 'U';
                        if (goalsH_41 > goalsA_41) {
                            pointsH_41 = 3; outcomeH_41 = 'S'; outcomeA_41 = 'N';
                        } else if (goalsA_41 > goalsH_41) {
                            pointsA_41 = 3; outcomeH_41 = 'N'; outcomeA_41 = 'S';
                        } else {
                            pointsH_41 = 1; pointsA_41 = 1; outcomeH_41 = 'U'; outcomeA_41 = 'U';
                        }

                        if (currentVariant === '81') {
                            if (isHomeEligible) {
                                stats[h].m += 1;
                                stats[h].g += goalsH_81;
                                stats[h].a += goalsA_81;
                                stats[h].p += pointsH_81;
                                if (outcomeH_81 === 'S') stats[h].w += 1;
                                else if (outcomeH_81 === 'U') stats[h].d += 1;
                                else stats[h].l += 1;
                                stats[h].formGames.push({ outcome: outcomeH_81, date: res.datum });
                            }
                            if (isAwayEligible) {
                                stats[a].m += 1;
                                stats[a].g += goalsA_81;
                                stats[a].a += goalsH_81;
                                stats[a].p += pointsA_81;
                                if (outcomeA_81 === 'S') stats[a].w += 1;
                                else if (outcomeA_81 === 'U') stats[a].d += 1;
                                else stats[a].l += 1;
                                stats[a].formGames.push({ outcome: outcomeA_81, date: res.datum });
                            }
                        } else if (currentVariant === '41') {
                            if (isHomeEligible) {
                                stats[h].m += 1;
                                stats[h].g += goalsH_41;
                                stats[h].a += goalsA_41;
                                stats[h].p += pointsH_41;
                                if (outcomeH_41 === 'S') stats[h].w += 1;
                                else if (outcomeH_41 === 'U') stats[h].d += 1;
                                else stats[h].l += 1;
                                stats[h].formGames.push({ outcome: outcomeH_41, date: res.datum });
                            }
                            if (isAwayEligible) {
                                stats[a].m += 1;
                                stats[a].g += goalsA_41;
                                stats[a].a += goalsH_41;
                                stats[a].p += pointsA_41;
                                if (outcomeA_41 === 'S') stats[a].w += 1;
                                else if (outcomeA_41 === 'U') stats[a].d += 1;
                                else stats[a].l += 1;
                                stats[a].formGames.push({ outcome: outcomeA_41, date: res.datum });
                            }
                        } else { // 'gesamt'
                            if (isHomeEligible) {
                                stats[h].m += 2; // plays both formats
                                stats[h].g += (goalsH_81 + goalsH_41);
                                stats[h].a += (goalsA_81 + goalsA_41);
                                stats[h].p += (pointsH_81 + pointsH_41);

                                if (outcomeH_81 === 'S') stats[h].w += 1;
                                else if (outcomeH_81 === 'U') stats[h].d += 1;
                                else stats[h].l += 1;

                                if (outcomeH_41 === 'S') stats[h].w += 1;
                                else if (outcomeH_41 === 'U') stats[h].d += 1;
                                else stats[h].l += 1;

                                stats[h].formGames.push({ outcome: outcomeH_81, date: res.datum });
                                stats[h].formGames.push({ outcome: outcomeH_41, date: res.datum });
                            }
                            if (isAwayEligible) {
                                stats[a].m += 2; // plays both formats
                                stats[a].g += (goalsA_81 + goalsA_41);
                                stats[a].a += (goalsH_81 + goalsH_41);
                                stats[a].p += (pointsA_81 + pointsA_41);

                                if (outcomeA_81 === 'S') stats[a].w += 1;
                                else if (outcomeA_81 === 'U') stats[a].d += 1;
                                else stats[a].l += 1;

                                if (outcomeA_41 === 'S') stats[a].w += 1;
                                else if (outcomeA_41 === 'U') stats[a].d += 1;
                                else stats[a].l += 1;

                                stats[a].formGames.push({ outcome: outcomeA_81, date: res.datum });
                                stats[a].formGames.push({ outcome: outcomeA_41, date: res.datum });
                            }
                        }
                    }
                });
            });

            let tableArray = Object.values(stats);
            tableArray.sort((a, b) => {
                if (b.p !== a.p) return b.p - a.p;
                const diffA = a.g - a.a;
                const diffB = b.g - b.a;
                if (diffB !== diffA) return diffB - diffA;
                return b.g - a.g;
            });

            const tbody = document.getElementById("tabelle-body");
            tbody.innerHTML = "";

            tableArray.forEach((t, i) => {
                let diff = t.g - t.a;
                let diffSign = diff > 0 ? "+" : "";

                let formHtml = "";
                // Sort the played games chronologically by their database date
                t.formGames.sort((x, y) => x.date - y.date);
                // Show the last 5 individual outcomes in the form curve
                const recentForm = t.formGames.slice(-5).map(g => g.outcome);
                recentForm.forEach(outcome => {
                    let badgeClass = "";
                    if (outcome === 'S') badgeClass = "win";
                    else if (outcome === 'U') badgeClass = "draw";
                    else if (outcome === 'N') badgeClass = "loss";
                    formHtml += `<span class="form-badge ${badgeClass}">${outcome}</span>`;
                });
                if (recentForm.length === 0) {
                    formHtml = `<span style="color:#999; font-size:0.85rem; font-style:italic;">-</span>`;
                }

                let row = `
                    <tr>
                        <td class="td-rank">${i + 1}</td>
                        <td class="td-team"><img src="${t.logo}">${t.name}</td>
                        <td class="td-matches">${t.m}</td>
                        <td class="hide-mobile">${t.w}</td>
                        <td class="hide-mobile">${t.d}</td>
                        <td class="hide-mobile">${t.l}</td>
                        <td class="td-goals">${t.g}:${t.a}</td>
                        <td class="td-diff">${diffSign}${diff}</td>
                        <td class="td-points">${t.p}</td>
                        <td class="hide-mobile" style="text-align: center; white-space: nowrap;">${formHtml}</td>
                    </tr>`;
                tbody.innerHTML += row;
            });
        }

        function changeMatchday(delta) {
            const select = document.getElementById('matchday-select');
            let newVal = parseInt(select.value) + delta;
            if (newVal >= 0 && newVal < schedule.length) {
                select.value = newVal;
                renderSchedule();
            }
        }

        function renderSchedule() {
            const select = document.getElementById('matchday-select');
            const dayIndex = parseInt(select.value);
            const day = schedule[dayIndex];
            const list = document.getElementById('schedule-list');
            list.innerHTML = "";

            if (!day) return; // Prevent errors during active config load/transitions

            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');

            if (dayIndex === 0) btnPrev.style.visibility = 'hidden'; else btnPrev.style.visibility = 'visible';
            if (dayIndex === schedule.length - 1) btnNext.style.visibility = 'hidden'; else btnNext.style.visibility = 'visible';

            // Insert matchday sponsor placeholder
            list.innerHTML += `
                <a href="sponsoring.html" style="text-decoration:none; display:block;">
                    <div class="matchday-sponsor">
                        <span>Dieser ${dayIndex + 1}. Spieltag wird präsentiert von:</span>
                        <div class="placeholder-logo">Platzhalter Logo / Unternehmen</div>
                    </div>
                </a>
            `;

            day.matches.forEach(match => {
                const h = match[0];
                const a = match[1];
                
                let dateFixed = null;
                if (h && a) {
                    const matchId = h + '_' + a;
                    if (allMatchDates[matchId]) {
                        dateFixed = allMatchDates[matchId].date + ", " + allMatchDates[matchId].time;
                    }
                }

                if (!a) {
                    list.innerHTML += `<div class="match-row" style="color:#666; justify-content:center;">${h} hat Spielfrei</div>`;
                    return;
                }

                const res = allResults[`${h}_${a}`];
                let centerHtml = "";

                if (res) {
                    const mainLabel = selectedAgeGroup === "2016" ? "6+1" : "8+1";
                    centerHtml = `
                        <div class="match-score-box">
                            <div class="score-line-main">${mainLabel}: ${res.gH_81}:${res.gA_81}</div>
                            <div class="score-line-sub">TG: ${res.gH_41}:${res.gA_41}</div>
                        </div>`;
                } else if (dateFixed) {
                    let parts = dateFixed.split(', ');
                    if (parts.length === 2) {
                        let datePart = parts[0].replace(/\.\d{4}$/, '.');
                        centerHtml = `
                            <div class="match-date-center">
                                <div class="date-top">${datePart}</div>
                                <div class="time-bottom">${parts[1]}</div>
                            </div>`;
                    } else {
                        centerHtml = `<div class="match-date-center">${dateFixed}</div>`;
                    }
                } else {
                    centerHtml = `<div class="match-vs">vs</div>`;
                }

                let row = `
                    <div class="match-row clickable" onclick="window.location.href='spiel.html?saison=' + selectedSeason + '&jahrgang=' + selectedAgeGroup + '&heim=' + encodeURIComponent('${h}') + '&gast=' + encodeURIComponent('${a}')">
                        <div class="match-team home">
                            ${h} <img src="${teamLogos[h]}">
                        </div>
                        <div class="match-center">
                            ${centerHtml}
                        </div>
                        <div class="match-team away">
                            <img src="${teamLogos[a]}"> ${a}
                        </div>
                    </div>`;
                list.innerHTML += row;
            });
        }


    </script>
</body>

</html>
